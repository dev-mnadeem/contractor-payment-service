name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ["18.x", "20.x", "22.x"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # sqlite3 downloads its native binding in an install script, so this
      # cannot run with --ignore-scripts.
      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm test

      - name: Seed a throwaway database twice to check idempotency
        run: |
          DB_STORAGE=./ci.sqlite3 npm run seed:reset
          DB_STORAGE=./ci.sqlite3 npm run seed
